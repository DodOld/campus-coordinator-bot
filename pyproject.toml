[project]
name = "campus-coordinator-bot"
version = "0.1.0"
description = "Production-ready Telegram coordination bot for forum groups"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "aiohttp>=3.11,<4",
  "aiohttp-socks>=0.10,<1",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "icalendar>=6.1,<7",
  "pydantic-settings>=2.7,<3",
  "python-dateutil>=2.9,<3",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
campus-coordinator-bot = "app.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
